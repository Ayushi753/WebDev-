<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
   <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <body>
    <div class="container">
    <div class="wrapper">
      <div class="title"><span>LOGIN PAGE</span></div>
      <form action="#">
        <div class="row">
          <i class="fa-solid fa-user"></i>
          <input type="text" placeholder="Enter your email or phone number" />
        </div>

        <div class="row">
          <i class="fa-solid fa-lock"></i>
          <input type="password" placeholder="Enter your password" />
        </div>

        <div class="pass"><a href="#"> Forget Password?</a></div>

        <div class="row button">
          <input type="Submit" value="Login" />
        </div>

        <div class="signup-link">Don't have an account?<a href="#"> Sign up</a></div>
      </form>
    </div>
    <div class="container"></div>
</div>
  </body>
</html>
